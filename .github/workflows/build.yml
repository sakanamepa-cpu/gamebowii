name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - project.zip
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Unpack project
        run: |
          mkdir proj
          unzip -q project.zip -d proj
      - name: Build
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk GameBoWii.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: GameBoWii.apk
